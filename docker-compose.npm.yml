# Nginx Proxy Manager - SSL & Reverse Proxy Management
# This will handle SSL certificates automatically with Let's Encrypt
# 
# Usage:
#   docker-compose -f docker-compose.npm.yml up -d
#
# Access:
#   Admin UI: http://your-server-ip:81
#   Default login: admin@example.com / changeme
#
# After first login, you MUST change the password!

version: '3.8'

services:
  nginx-proxy-manager:
    image: 'jc21/nginx-proxy-manager:latest'
    container_name: nginx_proxy_manager
    restart: unless-stopped
    ports:
      # HTTP
      - '80:80'
      # HTTPS
      - '443:443'
      # Admin Web UI
      - '81:81'
    environment:
      # MySQL/MariaDB connection (uses internal SQLite by default)
      # Uncomment below if you want to use external MySQL
      # DB_MYSQL_HOST: "npm_db"
      # DB_MYSQL_PORT: 3306
      # DB_MYSQL_USER: "npm_user"
      # DB_MYSQL_PASSWORD: "npm_password"
      # DB_MYSQL_NAME: "npm_db"
      
      # Disable IPv6 if not needed
      DISABLE_IPV6: 'true'
    volumes:
      # Persistent data
      - npm_data:/data
      # Let's Encrypt certificates
      - npm_letsencrypt:/etc/letsencrypt
    networks:
      - npm-network
      - app-network  # Connect to Laravel app network
    healthcheck:
      test: ["CMD", "/bin/check-health"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Optional: MariaDB for NPM (if you want external database)
  # npm-db:
  #   image: 'mariadb:10.11'
  #   container_name: npm_mariadb
  #   restart: unless-stopped
  #   environment:
  #     MYSQL_ROOT_PASSWORD: 'npm_root_password'
  #     MYSQL_DATABASE: 'npm_db'
  #     MYSQL_USER: 'npm_user'
  #     MYSQL_PASSWORD: 'npm_password'
  #   volumes:
  #     - npm_mysql:/var/lib/mysql
  #   networks:
  #     - npm-network

networks:
  npm-network:
    driver: bridge
  app-network:
    external: true
    name: webshop_app-network

volumes:
  npm_data:
    driver: local
  npm_letsencrypt:
    driver: local
  # npm_mysql:
  #   driver: local
